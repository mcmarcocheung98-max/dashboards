name: source-health
on:
  schedule:
    - cron: "17 7 * * *"          # daily, 07:17 UTC
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check /api/health and keep the issue in step
        env:
          GH_TOKEN: ${{ github.token }}
          DASHBOARDS_URL: ${{ vars.DASHBOARDS_URL || 'https://dashboards-production-bde6.up.railway.app' }}
        run: python .github/scripts/health_issue.py
