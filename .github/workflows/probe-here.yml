name: probe-here
# Runs the same source probe as /api/probe, but from a GitHub runner: shows which sources GitHub can reach when Railway cannot.
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Probe from GitHub
        run: |
          python - <<'PY'
          import json
          from app import topics
          res = topics.probe()
          for k, v in res.items():
              r = v["requests"]
              print(f"{k:30} requests={r.get('status', r.get('error'))}  curl={v['curl']}")
          PY
