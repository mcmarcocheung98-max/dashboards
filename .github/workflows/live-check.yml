name: live-check
# Opens every tab of every dashboard on the deployed site in headless Chromium (scripts/smoke.py --live) and checks /api/health.
# Run it by hand after a deploy (Actions > live-check > Run workflow); screenshots are attached to the run.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Site to check"
        default: "https://dashboards-production-bde6.up.railway.app"
permissions:
  contents: read
  actions: write                 # to delete old screenshot artifacts (the prune step)
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40             # two passes over 150+ tabs; a slow dashboard must not cut the run before the PROBLEMS list prints
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt playwright && python -m playwright install --with-deps chromium
      - name: Source health
        run: |
          curl -fsS "${{ inputs.url }}/api/health" | python -c "
          import json, sys
          h = json.load(sys.stdin)
          print('checked', h['checked'])
          for slug, d in h['dashboards'].items():
              print(f\"{slug:12} fresh={d['fresh']} stale={d['stale']} failing={d['failing']} alerts={d['alerts']}\")
              for s in d['sources']:
                  if s['status'] != 'fresh':
                      print('   ', s['status'], s['host'], s['since'], s['error'] or '')
          "
      - name: Every tab
        env:
          SMOKE_PASSCODE: ${{ secrets.PRIVATE_PASSCODE }}      # optional: without it the private dashboards are skipped
        run: python scripts/smoke.py --live "${{ inputs.url }}" --out smoke-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-shots
          path: smoke-shots/
          retention-days: 3          # 48 MB a run; the dev agent reads them the same morning
          compression-level: 0       # PNGs do not compress; skips the slowest part of the upload
      - name: Prune smoke-shots older than 3 days
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            -q '.artifacts[] | select(.name == "smoke-shots" and .expired == false and .created_at < (now - 3 * 86400 | todate)) | .id' \
            | xargs -r -n1 -I{} sh -c 'gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/{}" && echo "deleted {}"'
      - name: Actions usage, last 7 days
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Runner minutes per day and workflow (each job rounded up to a whole minute, as GitHub bills a private repo).
          # The repo is public, so these cost nothing; the dev agent reports the line each morning so a jump is noticed.
          gh run list --limit 400 --json workflowName,createdAt,startedAt,updatedAt,status \
            -q '[.[] | select(.status == "completed" and .createdAt > (now - 7 * 86400 | todate))
                 | {d: .createdAt[:10], w: .workflowName, m: ((((.updatedAt | fromdate) - (.startedAt | fromdate)) / 60) | ceil)}]
                | group_by(.d)[] | "USAGE \(.[0].d) total=\(map(.m) | add)min runs=\(length) " + (group_by(.w) | map("\(.[0].w)=\(map(.m) | add)") | join(" "))'
