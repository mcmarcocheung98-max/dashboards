<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<meta name="description" content="A thematic data dashboard: public, read-only.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232a78d6'/><path d='M7 22l6-7 5 4 7-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js" integrity="sha384-OK7vELvjHdhUFi31JYioPIcRHTROLdcDa6ZsNWgvgLaKj+9JqhU0Ad8g4wz3CXjA" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #f6f6f4; --surface: #ffffff; --ink: #141413; --ink2: #52514e; --muted: #8a8984; --line: #e6e5e1; --chip: #efeeea;
    --up: #1f9d63; --down: #d6453d; --s1: #2a78d6; --s2: #eb6834; --s3: #1f9d63; --s4: #8a5cd1; --s5: #c7408f; --s6: #1a9aa0; --z1: #c7372f; --z2: #ee9a8f; --sellt: #e0702a; --z4: #86c9a6; --z5: #1b8a57; --hold: #8f8e88; --accent: #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121211; --surface: #1c1c1a; --ink: #f2f1ed; --ink2: #b9b8b3; --muted: #8a8984; --line: #2e2d2a; --chip: #292826;
      --up: #3cc184; --down: #f0675f; --s1: #5a9cf0; --s2: #f4884f; --s3: #3cc184; --s4: #a888ea; --s5: #e06aaa; --s6: #3cc0c6; --z1: #f0675f; --z2: #a95b55; --sellt: #f4884f; --z4: #4f8f6e; --z5: #3cc184; --hold: #8f8e88; --accent: #5a9cf0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121211; --surface: #1c1c1a; --ink: #f2f1ed; --ink2: #b9b8b3; --muted: #8a8984; --line: #2e2d2a; --chip: #292826;
    --up: #3cc184; --down: #f0675f; --s1: #5a9cf0; --s2: #f4884f; --s3: #3cc184; --s4: #a888ea; --s5: #e06aaa; --s6: #3cc0c6; --z1: #f0675f; --z2: #a95b55; --sellt: #f4884f; --z4: #4f8f6e; --z5: #3cc184; --hold: #8f8e88; --accent: #5a9cf0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { max-width: 1100px; margin: 0 auto; padding: 20px 16px 8px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
  h1 { font-size: 20px; margin: 0; font-weight: 650; }
  .sub { color: var(--muted); font-size: 12.5px; }
  nav { max-width: 1100px; margin: 0 auto; padding: 4px 16px 0; display: flex; gap: 6px; overflow-x: auto; }
  nav button { border: 1px solid var(--line); background: var(--surface); color: var(--ink2); border-radius: 999px; padding: 6px 14px; font: inherit; cursor: pointer; white-space: nowrap; }
  nav button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { max-width: 1100px; margin: 0 auto; padding: 12px 16px 40px; display: grid; gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
  .card h2 { font-size: 14.5px; margin: 0 0 10px; font-weight: 650; }
  .grid2 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
  .kpi .v { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .kpi .l { color: var(--muted); font-size: 12px; }
  .up { color: var(--up); } .down { color: var(--down); } .muted { color: var(--muted); font-size: 12.5px; }
  .chart { height: 300px; width: 100%; }
  .chart.small { height: 200px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0 0 8px; font-size: 12.5px; }
  .legend button { border: 0; background: none; color: var(--ink2); font: inherit; padding: 2px 0; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .legend button.off { opacity: .4; }
  .legend button.csv { margin-left: auto; color: var(--muted); font-size: 12px; }
  .legend button.csv:hover { color: var(--ink); }
  .sw { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
  .sw.dash { background: repeating-linear-gradient(90deg, var(--hold) 0 4px, transparent 4px 7px) !important; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  th:first-child, td:first-child { text-align: left; }
  td.wrap { white-space: normal; min-width: 220px; text-align: left; color: var(--ink2); }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; background: var(--chip); color: var(--ink2); font-size: 12px; }
  .pill.ok { color: var(--up); } .pill.bad { color: var(--down); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 8px; }
  .seg button { border: 0; background: var(--surface); color: var(--ink2); padding: 4px 10px; font: inherit; font-size: 12.5px; cursor: pointer; }
  .seg button.on { background: var(--chip); color: var(--ink); font-weight: 600; }
  .bar { position: relative; height: 6px; background: var(--chip); border-radius: 3px; min-width: 80px; }
  .bar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
  .err { color: var(--down); }
  .nfa { font-size: 12.5px; color: var(--ink2); border-style: dashed; }
  .md { font-size: 13.5px; line-height: 1.55; }
  .md p, .md ul, .md ol, .md pre { margin: 0 0 8px; }
  .md ul, .md ol { padding-left: 20px; }
  .md li { margin: 2px 0; }
  .md code { font-size: 12px; background: color-mix(in srgb, var(--line) 60%, transparent); padding: 1px 4px; border-radius: 4px; }
  .md pre { overflow-x: auto; padding: 8px 10px; background: color-mix(in srgb, var(--line) 40%, transparent); border-radius: 8px; }
  .md pre code { background: none; padding: 0; }
  .md .tw { overflow-x: auto; margin: 0 0 8px; }
  .md th, .md td { text-align: left; white-space: normal; vertical-align: top; min-width: 80px; }
  footer { max-width: 1100px; margin: 0 auto; padding: 0 16px 30px; color: var(--muted); font-size: 12px; }
</style>
<style>
  .crumbs { max-width: 1100px; margin: 0 auto; padding: 14px 16px 0; font-size: 12.5px; color: var(--muted); }
  .crumbs a { color: var(--muted); text-decoration: none; } .crumbs a:hover { color: var(--ink); }
  .rangebar { position: sticky; top: 0; z-index: 5; max-width: 1100px; margin: 0 auto; padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; background: var(--bg); }
  .rangebar[hidden] { display: none; }
  .rangebar .seg { margin: 0; }
  .rangebar .lab { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .warn { font-size: 12.5px; color: var(--sellt); }
  .src { font-size: 12px; color: var(--muted); } .src a { color: var(--ink2); }
  .tl { display: grid; grid-template-columns: 90px 1fr; gap: 6px 12px; font-size: 13px; }
  .tl .d { color: var(--muted); font-variant-numeric: tabular-nums; }
  .tl a { color: var(--ink); text-decoration: none; border-bottom: 1px dotted var(--line); }
  /* Ask Claude: a round icon floating on the screen that you can drag anywhere (its place is remembered for every dashboard); a click
     opens the chat next to it, which can be dragged by its header too */
  #askfab { position: fixed; left: 0; top: 0; width: 52px; height: 52px; z-index: 60; border: 0; border-radius: 50%; background: var(--accent); color: #fff;
    box-shadow: 0 6px 20px rgba(0,0,0,.22); cursor: grab; touch-action: none; display: grid; place-items: center; user-select: none; }
  #askfab:active { cursor: grabbing; } #askfab svg { width: 24px; height: 24px; pointer-events: none; }
  #askfab.on { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent), 0 6px 20px rgba(0,0,0,.22); }
  #ask { position: fixed; left: 0; top: 0; width: 360px; height: min(520px, 70vh); z-index: 59; display: flex; flex-direction: column;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 32px rgba(0,0,0,.18); font-size: 13px; }
  #ask[hidden] { display: none; }
  #ask .ah { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: move; touch-action: none; user-select: none; }
  #ask .ah b { font-size: 13.5px; } #ask .ah .t { color: var(--muted); font-size: 12px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #ask .ah button { border: 0; background: none; color: var(--muted); cursor: pointer; font: inherit; font-size: 16px; padding: 0 4px; }
  #ask .msgs { overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 60px; }
  #ask .m { padding: 8px 10px; border-radius: 10px; line-height: 1.45; }
  #ask .m.q { background: var(--chip); align-self: flex-end; max-width: 90%; }
  #ask .m.a { border: 1px solid var(--line); }
  #ask .m.a p { margin: 0 0 6px; } #ask .m.a p:last-child { margin: 0; } #ask .m.a ul { margin: 0 0 6px; padding-left: 18px; }
  #ask .m.err { color: var(--down); border: 1px dashed var(--line); }
  #ask .sugg { display: flex; flex-wrap: wrap; gap: 6px; }
  #ask .sugg button { border: 1px solid var(--line); background: var(--surface); color: var(--ink2); border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; text-align: left; }
  #ask form { display: flex; gap: 6px; padding: 8px 12px 4px; border-top: 1px solid var(--line); }
  #ask textarea { flex: 1; resize: none; height: 54px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: inherit; background: var(--bg); color: var(--ink); }
  #ask form button { border: 0; background: var(--accent); color: #fff; border-radius: 8px; padding: 0 12px; font: inherit; cursor: pointer; }
  #ask form button:disabled { opacity: .5; cursor: default; }
  #ask .foot { color: var(--muted); font-size: 11.5px; padding: 0 12px 10px; }
  @media (max-width: 599px) { #ask { left: 8px !important; right: 8px; top: auto !important; bottom: 8px; width: auto; height: 62vh; } #ask .ah { cursor: default; }
    #askfab.on { display: none; } }
</style>
</head>
<body>
<div class="crumbs"><a href="/">All dashboards</a><span id="crumbcat"></span></div>
<header>
  <div><h1 id="title">Dashboard</h1><div class="sub" id="blurb"></div></div>
  <div class="sub" id="stamp"></div>
</header>
<nav id="tabs"></nav>
<div class="rangebar" id="rangebar" hidden></div>
<main id="view"><div class="card muted">Loading…</div></main>
<footer id="foot"></footer>
<script>
// Shared shell for every dashboard (/<slug>): chart helpers, tabs, loading, footer. The dashboard itself is static/topics/<slug>.js, which sets window.TOPIC.
const SLUG = location.pathname.split("/").filter(Boolean).pop();
const SERIES = ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6"];
let META = null, TABS = [], current = (location.hash || "#").slice(1), charts = [], timer = null;

const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v); }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
};
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const pct = (v, d = 1) => v == null ? "–" : (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v * 100).toFixed(d) + "%";
const cls = v => v > 0 ? "up" : v < 0 ? "down" : "";
const card = (title, ...kids) => el("div", { class: "card" }, title ? el("h2", {}, title) : null, ...kids);
const kpi = (l, v, c = "") => el("div", { class: "kpi" }, el("div", { class: "v " + c }, v), el("div", { class: "l" }, l));
const when = ts => new Date(ts * 1000).toLocaleString([], { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
const dayOf = ts => new Date(ts * 1000).toLocaleDateString([], { day: "2-digit", month: "short", year: "numeric", timeZone: "UTC" });

function newChart(host, opts = {}) {
  const c = LightweightCharts.createChart(host, Object.assign({
    autoSize: true, layout: { background: { color: "transparent" }, textColor: css("--muted"), fontSize: 11 },
    grid: { vertLines: { visible: false }, horzLines: { color: css("--line") } }, crosshair: { mode: 1 },
    rightPriceScale: { borderVisible: false }, timeScale: { borderVisible: false, timeVisible: true },
    // the mouse wheel and a vertical swipe scroll the page, not the chart; drag to pan, pinch or drag an axis to zoom
    handleScroll: { mouseWheel: false, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false }, handleScale: { mouseWheel: false, pinch: true, axisPressedMouseMove: true },
  }, opts));
  c.timeScale().applyOptions({ minBarSpacing: 0.05 });          // 5 years of daily points must fit a half-width card
  charts.push(c);
  return c;
}
// fit once the chart has a real width (a chart created while its card was still being laid out would otherwise fit at width 0 and stay squashed)
const fit = c => { let n = 0; const go = () => { if (c.timeScale().width() > 0 || n++ > 30) c.timeScale().fitContent(); else setTimeout(go, 100); }; requestAnimationFrame(() => requestAnimationFrame(go)); };
// ---------- one date axis for the whole tab: every time chart joins SYNC; dragging or zooming one moves all, the range bar sets all.
// A chart with `extend` (a projection running past today) follows the range's start and keeps its own end.
const PRESETS = [["3m", "3M", 91], ["6m", "6M", 182], ["1y", "1Y", 365], ["2y", "2Y", 730], ["5y", "5Y", 1826], ["all", "All", 0]];
let SYNC = [], SYNCING = false, RANGE = (() => { try { return JSON.parse(sessionStorage.getItem("range:" + location.pathname) || '"all"'); } catch (e) { return "all"; } })();
const saveRange = () => { try { sessionStorage.setItem("range:" + location.pathname, JSON.stringify(RANGE)); } catch (e) {} };
const lastTime = () => Math.max(0, ...SYNC.map(e => e.lastPast || 0)) || Math.floor(Date.now() / 1000);
function rangeNow() {
  if (RANGE && typeof RANGE === "object") return RANGE;
  const p = PRESETS.find(x => x[0] === RANGE);
  if (!p || !p[2]) return null;
  const to = lastTime();
  return { from: to - p[2] * 86400, to: to + 86400 };
}
function applyTo(e, r) {
  if (!e.c.timeScale().width()) return;
  SYNCING = true;
  try {
    if (!r) e.c.timeScale().fitContent();
    else e.c.timeScale().setVisibleRange(e.extend ? { from: r.from, to: Math.max(r.to, e.last) } : r);
  } catch (err) { /* a range outside this chart's data: leave it as it is */ }
  setTimeout(() => { SYNCING = false; }, 0);
}
function applyAll() { const r = rangeNow(); SYNC.forEach(e => applyTo(e, r)); rangeBar(); }
function syncAdd(c, series, pts, opts = {}) {
  const map = new Map(pts.map(p => [p.time, p.value]));
  const times = pts.map(p => p.time);
  const now = Date.now() / 1000;
  const e = { c, series, map, times, extend: !!opts.extend, last: times[times.length - 1] || 0, lastPast: Math.max(0, ...times.filter(t => t <= now + 86400)), ready: false };
  SYNC.push(e);
  let n = 0;
  const first = () => { if (c.timeScale().width() > 0 || n++ > 30) { applyTo(e, rangeNow()); setTimeout(() => { e.ready = true; }, 120); rangeBar(); } else setTimeout(first, 100); };
  requestAnimationFrame(() => requestAnimationFrame(first));
  c.timeScale().subscribeVisibleTimeRangeChange(r => {
    if (SYNCING || !e.ready || !r || !SYNC.includes(e)) return;
    const to = e.extend ? Math.min(r.to, lastTime() + 86400) : r.to;
    RANGE = { from: r.from, to }; saveRange();
    SYNC.forEach(o => { if (o !== e && o.ready) applyTo(o, RANGE); });
    rangeBar();
  });
  c.subscribeCrosshairMove(p => {
    if (SYNCING || !SYNC.includes(e)) return;
    SYNCING = true;
    try {
      SYNC.forEach(o => {
        if (o === e || !o.series) return;
        if (!p || p.time == null) { o.c.clearCrosshairPosition(); return; }
        let t = p.time, v = o.map.get(t);
        if (v == null && o.times.length) {             // nearest point on the other chart (weekly vs daily data)
          let lo = 0, hi = o.times.length - 1;
          while (lo < hi) { const mid = (lo + hi) >> 1; if (o.times[mid] < t) lo = mid + 1; else hi = mid; }
          if (Math.abs(o.times[lo] - t) <= 8 * 86400) { t = o.times[lo]; v = o.map.get(t); }
        }
        // lightweight-charts throws "Value is null" when the other chart's price scale has no point in the
        // visible range (a long series zoomed past a short one). Clear the marker instead of breaking the page.
        if (v == null) { o.c.clearCrosshairPosition(); return; }
        try { o.c.setCrosshairPosition(v, t, o.series); }
        catch (err) { o.c.clearCrosshairPosition(); }
      });
    } finally { SYNCING = false; }
  });
  return e;
}
function rangeBar() {
  const bar = document.getElementById("rangebar");
  if (!bar) return;
  const live = SYNC.filter(e => charts.includes(e.c));
  bar.hidden = !live.length;
  if (!live.length) return;
  const r = rangeNow(), d = t => new Date(t * 1000).toLocaleDateString([], { day: "2-digit", month: "short", year: "numeric", timeZone: "UTC" });
  const key = typeof RANGE === "string" ? RANGE : null;
  bar.replaceChildren(el("span", { class: "lab" }, "Dates, all charts:"),
    el("div", { class: "seg" }, ...PRESETS.map(([k, l]) => el("button", { class: k === key ? "on" : "", onclick: () => { RANGE = k; saveRange(); applyAll(); } }, l))),
    el("span", { class: "lab" }, r ? d(r.from) + " – " + d(Math.min(r.to, lastTime())) : "full history"));
}
const dedupe = pts => { const m = new Map(); pts.forEach(([t, v]) => m.set(Math.round(t), v)); return [...m].sort((a, b) => a[0] - b[0]).map(([time, value]) => ({ time, value })); };

// ---------- "CSV" button on every chart's legend: the numbers the chart draws, as a file (one row per date or x value, one column per line)
const csvCell = v => v == null || (typeof v === "number" && !isFinite(v)) ? "" : /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v);
const csvText = (head, rows) => [head, ...rows].map(r => r.map(csvCell).join(",")).join("\n") + "\n";
const csvName = what => [SLUG, current, what].filter(Boolean).join("-").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 80) + ".csv";
const isoTime = t => t % 86400 ? new Date(t * 1000).toISOString().slice(0, 16).replace("T", " ") : new Date(t * 1000).toISOString().slice(0, 10);
// series [{name, points: [[x, y], ...]}] -> CSV text; the x values of every series joined, a blank cell where a series has no point
function seriesCsv(series, xHead, xFmt = v => v) {
  const have = series.filter(s => s.points && s.points.length);
  const xs = [...new Set(have.flatMap(s => s.points.map(p => p[0])))].sort((a, b) => a - b);
  const maps = have.map(s => new Map(s.points.map(p => [p[0], p[1]])));
  return csvText([xHead, ...have.map((s, i) => s.name || "line " + (i + 1))], xs.map(x => [xFmt(x), ...maps.map(m => m.get(x))]));
}
function csvButton(name, make) {
  return el("button", { class: "csv", type: "button", title: "Download this chart's numbers as a CSV file", onclick: () => {
    const a = el("a", { href: URL.createObjectURL(new Blob([make()], { type: "text/csv;charset=utf-8" })), download: name });
    document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  } }, "CSV ↓");
}

// several lines on one axis, a legend that toggles each line, values shown under the crosshair
function linesChart(series, fmt, opts = {}) {
  const host = el("div", { class: "chart" + (opts.small ? " small" : "") });
  const legend = el("div", { class: "legend" });
  setTimeout(() => {
    const left = series.some(s => s.axis === "left" && s.points && s.points.length);
    const c = newChart(host, { timeScale: { borderVisible: false, timeVisible: !!opts.time }, rightPriceScale: { borderVisible: false, mode: opts.log ? 1 : 0 },
      leftPriceScale: { visible: left, borderVisible: false, mode: opts.leftLog ? 1 : 0 } });
    const made = series.filter(s => s.points && s.points.length).map((s, i) => {
      const color = s.color || css(SERIES[i % SERIES.length]), f = s.fmt || fmt;
      const common = { priceLineVisible: false, lastValueVisible: false, priceScaleId: s.axis === "left" ? "left" : "right", priceFormat: { type: "custom", formatter: f, minMove: 0.0001 } };
      // s.bar: a histogram (green up, red down, unless the series has its own colour)
      const line = s.bar ? c.addHistogramSeries({ ...common, color }) : c.addLineSeries({ ...common, color, lineWidth: s.dashed ? 1 : (s.width || 2), lineStyle: s.dashed ? 2 : 0 });
      const data = dedupe(s.points.filter(p => p[1] != null));            // a blank day is a gap, not empty space at the start

const fmtVal = v => v == null ? "–" : typeof v === "number" ? num(v, Math.abs(v) < 10 ? 2 : Math.abs(v) < 1000 ? 1 : 0) : String(v);
function squares(t) {
  return el("div", { style: "display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap" },
    el("div", { class: "muted", style: "min-width:110px" }, t.label),
    el("div", { style: "display:flex;gap:2px;flex-wrap:wrap" }, ...t.days.map(d => el("span", { title: d.date + (d.lean == null ? ": no reading" : d.lean > 0 ? ": leaning up" : d.lean < 0 ? ": leaning down" : ": neutral"),
      style: "width:11px;height:11px;border-radius:2px;border:1px solid var(--line);background:" + leanCol(d.lean) + (d.lean === 0 ? ";opacity:.45" : "") }))));
}
function flipRow(r, showTab) {
  const arrow = r.lean > r.was_lean ? "▲" : "▼";
  return el("div", { style: "margin-top:4px" }, el("span", { style: "color:" + leanCol(r.lean) + ";font-weight:650" }, arrow + " "), r.label + ": " + fmtVal(r.was) + " → " + fmtVal(r.value),
    showTab ? el("span", { class: "muted" }, " · ", el("a", { href: "#" + r.tab }, r.tab_label)) : null, r.note ? el("span", { class: "muted" }, " · " + r.note) : null);
}
function changesCard(tab, first) {
  CHANGES = CHANGES || api("changes").catch(() => ({ available: false }));
  return lazy(first ? "What changed since yesterday" : null, CHANGES, d => {
    if (!d || !d.available) return null;
    if (!d.since) return card(first ? "What changed since yesterday" : null, el("div", { class: "muted" }, d.first
      ? "Saving one snapshot a day since " + d.first + ": changes appear from the next day, and the squares build up over time."
      : "Saving one snapshot a day from today: changes appear from tomorrow."));
    const flips = d.flipped.filter(r => first || r.tab === tab);
    const strips = d.tabs.filter(t => first || t.tab === tab);
    if (!first && !flips.length && !strips.length) return null;
    const head = flips.length ? flips.map(r => flipRow(r, first)) : [el("div", { class: "muted" }, "No reading flipped since " + d.since + (d.moved.filter(r => first || r.tab === tab).length ? "; " + d.moved.filter(r => first || r.tab === tab).length + " moved without changing lean." : "."))];
    return card(first ? "What changed since yesterday" : "Since " + d.since, ...head, ...strips.map(squares),
      first ? note("Each square is one day: green leaning up, red leaning down, grey neutral. Compared with " + d.since + ".") : null);
  });
}

// ---- Ask Claude (app/ask.py): a floating icon you can drag anywhere on the screen; a click opens the chat beside it. Both are created
// once, outside the tabs, so they stay put while you scroll and switch tabs. The icon's place is kept for every dashboard in this
// browser (localStorage), the conversation for this dashboard in this browser tab (sessionStorage). Double-click the icon to send it
// back to its corner. The chat knows the tab you are on and the date kept on the top card.
const ASK = { box: null, fab: null, msgs: null, title: null, input: null, send: null, foot: null, hist: [], busy: false };
const askStore = { get(k, d) { try { const v = sessionStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const FAB = 52, EDGE = 20;
const phone = () => window.matchMedia("(max-width: 599px)").matches;
function askPos() {                                      // the icon's top-left corner in pixels, from the saved fraction of the window
  let p = null; try { p = JSON.parse(localStorage.getItem("ask:pos")); } catch (e) {}
  const w = innerWidth - FAB, h = innerHeight - FAB;
  const x = p && isFinite(p.x) ? p.x * w : w - EDGE, y = p && isFinite(p.y) ? p.y * h : h - EDGE;
  return { x: Math.min(Math.max(x, 4), w - 4), y: Math.min(Math.max(y, 4), h - 4) };
}
function askPlace(x, y, save) {                          // move the icon (clamped to the window) and keep the chat beside it
  const w = innerWidth - FAB, h = innerHeight - FAB;
  x = Math.min(Math.max(x, 4), w - 4); y = Math.min(Math.max(y, 4), h - 4);
  ASK.fab.style.left = x + "px"; ASK.fab.style.top = y + "px";
  if (save) try { localStorage.setItem("ask:pos", JSON.stringify({ x: w > 0 ? x / w : 1, y: h > 0 ? y / h : 1 })); } catch (e) {}
  if (!ASK.box.hidden && !phone()) {                     // the chat opens toward whichever side has room
    const bw = ASK.box.offsetWidth || 360, bh = ASK.box.offsetHeight || 520, gap = 10;
    let bx = x + FAB / 2 > innerWidth / 2 ? x - bw - gap : x + FAB + gap;
    let by = y + FAB / 2 > innerHeight / 2 ? y + FAB - bh : y;
    bx = Math.min(Math.max(bx, 8), innerWidth - bw - 8); by = Math.min(Math.max(by, 8), innerHeight - bh - 8);
    ASK.box.style.left = bx + "px"; ASK.box.style.top = by + "px";
  }
}
function askDrag(handle, onMove, onTap) {                // pointer drag (mouse and touch); a press that moves less than 5 px is a tap
  handle.addEventListener("pointerdown", e => {
    if (e.button !== 0 || e.target.closest("button:not(#askfab)")) return;
    const sx = e.clientX, sy = e.clientY, f = ASK.fab.getBoundingClientRect();
    let moved = false;
    handle.setPointerCapture(e.pointerId);
    const move = ev => { if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 5) return; moved = true; onMove(f.left + ev.clientX - sx, f.top + ev.clientY - sy); };
    const up = ev => { handle.removeEventListener("pointermove", move); handle.removeEventListener("pointerup", up); handle.removeEventListener("pointercancel", up);
      if (moved) askPlace(parseFloat(ASK.fab.style.left), parseFloat(ASK.fab.style.top), true); else if (onTap) onTap(ev); };
    handle.addEventListener("pointermove", move); handle.addEventListener("pointerup", up); handle.addEventListener("pointercancel", up);
  });
}
function askText(t) {                                    // light formatting from text nodes only: paragraphs, "- " bullets, **bold**
  const box = el("div");
  for (const block of String(t).split(/\n{2,}/)) {
    const lines = block.split("\n");
    const inline = line => line.split(/(\*\*[^*]+\*\*)/).map(x => x.startsWith("**") && x.endsWith("**") && x.length > 4 ? el("b", {}, x.slice(2, -2)) : x);
    if (lines.every(l => /^\s*[-•*]\s+/.test(l))) box.append(el("ul", {}, ...lines.map(l => el("li", {}, ...inline(l.replace(/^\s*[-•*]\s+/, ""))))));
    else box.append(el("p", {}, ...lines.flatMap((l, i) => [i ? el("br") : null, ...inline(l)])));
  }
  return box;
}
function askMsg(kind, text) {
  const m = el("div", { class: "m " + kind }, kind === "a" ? askText(text) : text);
  ASK.msgs.append(m); ASK.msgs.scrollTop = ASK.msgs.scrollHeight; return m;
}
function askKeptDate() {
  const s = document.querySelector("#view [data-follow-head] span.muted");
  return s && s.textContent.startsWith("Kept: ") ? s.textContent.slice(6).trim() : null;
}
function askSuggest() {
  const lab = (TABS.find(t => t[0] === current) || [current, current])[1];
  const qs = ["What does the " + lab + " tab show right now?", "What changed here recently, and why does it matter?", "What would signal that this trend is turning?"];
  return el("div", { class: "sugg" }, ...qs.map(q => el("button", { onclick: () => askSend(q) }, q)));
}
function askTab() {                                      // called on every tab change: the panel stays, only its subject changes
  if (!ASK.box) return;
  const lab = (TABS.find(t => t[0] === current) || [current, current])[1];
  ASK.title.textContent = "about " + lab;
  const old = ASK.msgs.querySelector(".sugg"); if (old) old.remove();
  if (!ASK.hist.length) ASK.msgs.append(askSuggest());
}
function askQuota(st) {
  if (!st) return;
  if (st.set_up === false) { ASK.foot.textContent = "Ask Claude is not set up yet."; ASK.send.disabled = true; return; }
  const l = st.left || {};
  ASK.foot.textContent = l.site_paused ? "Paused until tomorrow: the site's daily limit is used up." :
    (l.hour != null ? l.hour + " question" + (l.hour === 1 ? "" : "s") + " left this hour · " : "") + "answers use this page's data; not advice.";
}
async function askSend(q) {
  q = (q || ASK.input.value).trim();
  if (!q || ASK.busy) return;
  ASK.busy = true; ASK.send.disabled = true; ASK.input.value = "";
  const s = ASK.msgs.querySelector(".sugg"); if (s) s.remove();
  const date = askKeptDate();
  askMsg("q", q + (date ? "  (" + date + ")" : ""));
  const wait = askMsg("a", "Thinking…");
  try {
    const r = await fetch("/api/ask", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ slug: SLUG, tab: current, question: q, date, history: ASK.hist.slice(-3) }) });
    const j = await r.json().catch(() => ({ error: "bad response" }));
    wait.remove();
    if (!r.ok) { askMsg("err", j.error || r.statusText); }
    else { askMsg("a", j.answer); ASK.hist.push({ q, a: j.answer, tab: current }); ASK.hist = ASK.hist.slice(-12); askStore.set("ask:" + SLUG, ASK.hist); askQuota({ left: j.left }); }
  } catch (e) { wait.remove(); askMsg("err", "Could not reach Claude: " + e.message); }
  ASK.busy = false; ASK.send.disabled = false; ASK.input.focus();
}
function askOpen(open) {
  ASK.box.hidden = !open; ASK.fab.classList.toggle("on", open);
  ASK.fab.setAttribute("aria-expanded", open ? "true" : "false");
  try { localStorage.setItem("ask:closed", open ? "0" : "1"); } catch (e) {}
  if (open) { const p = askPos(); askPlace(p.x, p.y, false); ASK.input.focus({ preventScroll: true }); }
}
function askPanel() {
  ASK.title = el("span", { class: "t" });
  ASK.msgs = el("div", { class: "msgs" });
  ASK.input = el("textarea", { placeholder: "Ask about this tab…", maxlength: "1000", "aria-label": "Your question" });
  ASK.input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); askSend(); } });
  ASK.send = el("button", { type: "submit" }, "Ask");
  ASK.foot = el("div", { class: "foot" }, "Answers use this page's data; not advice.");
  const form = el("form", {}, ASK.input, ASK.send); form.addEventListener("submit", e => { e.preventDefault(); askSend(); });
  ASK.box = el("aside", { id: "ask", "aria-label": "Ask Claude" },
    el("div", { class: "ah" }, el("b", {}, "Ask Claude"), ASK.title, el("button", { title: "Clear the conversation", onclick: () => { ASK.hist = []; askStore.set("ask:" + SLUG, []); ASK.msgs.replaceChildren(); askTab(); } }, "↺"),
      el("button", { title: "Minimise (Esc)", onclick: () => askOpen(false) }, "–")),
    ASK.msgs, form, ASK.foot);
  ASK.fab = el("button", { id: "askfab", title: "Ask Claude (drag to move, double-click to reset)", "aria-label": "Ask Claude", "aria-expanded": "false" });
  ASK.fab.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01"/></svg>';
  document.body.append(ASK.box, ASK.fab);
  askDrag(ASK.fab, (x, y) => askPlace(x, y, false), () => askOpen(ASK.box.hidden));
  askDrag(ASK.box.querySelector(".ah"), (x, y) => { if (!phone()) askPlace(x, y, false); });   // dragging the chat moves the icon with it
  ASK.fab.addEventListener("dblclick", () => { try { localStorage.removeItem("ask:pos"); } catch (e) {} const p = askPos(); askPlace(p.x, p.y, false); });
  ASK.fab.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); askOpen(ASK.box.hidden); } });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !ASK.box.hidden) { askOpen(false); ASK.fab.focus(); } });
  window.addEventListener("resize", () => { const p = askPos(); askPlace(p.x, p.y, false); });
  ASK.hist = askStore.get("ask:" + SLUG, []);
  for (const h of ASK.hist) { askMsg("q", h.q); askMsg("a", h.a); }
  let closed = true; try { closed = localStorage.getItem("ask:closed") !== "0"; } catch (e) {}
  ASK.box.hidden = true;
  const p0 = askPos(); askPlace(p0.x, p0.y, false);
  askOpen(!closed);                                       // starts as just the icon unless the reader left the chat open
  askTab();
  fetch("/api/ask/status").then(r => r.json()).then(askQuota).catch(() => {});
}

function tabs() {
  document.getElementById("tabs").replaceChildren(...TABS.map(([k, l]) => el("button", { class: k === current ? "on" : "", onclick: () => { current = k; location.hash = k; tabs(); render(); } }, l)));
}
async function render() {
  clearTimeout(timer);
  const view = document.getElementById("view");
  view.style.opacity = ".45";
  document.getElementById("stamp").textContent = "Loading…";
  const old = charts;
  charts = [];
  SYNC = [];
  try {
    const about = current === "about";
    const nodes = await (about ? methodView() : window.TOPIC.VIEWS[current]());
    view.replaceChildren(...[about ? null : changesCard(current, current === TABS[0][0]), ...[].concat(nodes)].filter(Boolean));
    old.forEach(c => c.remove());
  } catch (e) {
    view.replaceChildren(card(null, el("div", { class: "err" }, "Could not load: " + e.message)));
    old.forEach(c => c.remove());
  }
  view.style.opacity = "";
  document.getElementById("stamp").textContent = "Updated " + new Date().toLocaleTimeString();
  rangeBar();
  askTab();
}
// the Method tab (#about): the calculation and caveat sections of data/<slug>/README.md (topics.method), rendered from a small
// subset of Markdown (paragraphs, lists, tables, code, bold, links) as DOM nodes, never as HTML
function mdInline(s) {
  return s.split(/(\*\*[^*]+\*\*|`[^`]+`|\[[^\]]+\]\([^)\s]+\))/).filter(Boolean).map(t => {
    if (t.startsWith("**") && t.endsWith("**") && t.length > 4) return el("strong", {}, mdInline(t.slice(2, -2)));
    if (t.startsWith("`") && t.endsWith("`") && t.length > 2) return el("code", {}, t.slice(1, -1));
    const m = t.match(/^\[([^\]]+)\]\(([^)\s]+)\)$/);
    if (m) return /^https?:\/\//.test(m[2]) ? link(m[1], m[2]) : el("span", {}, mdInline(m[1]));
    return t;
  });
}
function mdBlocks(text) {
  const lines = text.split("\n"), out = [];
  const isItem = l => /^\s*([-*]|\d+\.)\s+/.test(l), isTable = l => /^\s*\|/.test(l), isFence = l => /^\s*```/.test(l);
  const cells = l => l.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim());
  for (let i = 0; i < lines.length;) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    if (isFence(l)) {
      const code = [];
      for (i++; i < lines.length && !isFence(lines[i]); i++) code.push(lines[i]);
      i++;
      out.push(el("pre", {}, el("code", {}, code.join("\n"))));
    } else if (isTable(l)) {
      const rows = [];
      for (; i < lines.length && isTable(lines[i]); i++) if (!/^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i])) rows.push(cells(lines[i]));
      const [head, ...body] = rows;
      out.push(el("div", { class: "tw" }, el("table", {}, el("thead", {}, el("tr", {}, head.map(c => el("th", {}, mdInline(c))))),
        el("tbody", {}, body.map(r => el("tr", {}, r.map(c => el("td", {}, mdInline(c)))))))));
    } else if (isItem(l)) {
      const ordered = /^\s*\d+\./.test(l), items = [];
      for (; i < lines.length && lines[i].trim() && (isItem(lines[i]) || /^\s+\S/.test(lines[i])) && !isTable(lines[i]); i++) {
        if (isItem(lines[i])) items.push({ deep: /^\s{2,}/.test(lines[i]), text: lines[i].replace(/^\s*([-*]|\d+\.)\s+/, "") });
        else items[items.length - 1].text += " " + lines[i].trim();
      }
      out.push(el(ordered ? "ol" : "ul", {}, items.map(it => el("li", it.deep ? { style: "margin-left:18px" } : {}, mdInline(it.text)))));
    } else {
      const para = [];
      for (; i < lines.length && lines[i].trim() && !isItem(lines[i]) && !isTable(lines[i]) && !isFence(lines[i]); i++) para.push(lines[i].trim().replace(/^#+\s+/, ""));
      out.push(el("p", {}, mdInline(para.join(" "))));
    }
  }
  return el("div", { class: "md" }, out);
}
async function methodView() {
  const d = await api("method");
  return [...d.sections.map(s => card(s.title.replace(/[`*]/g, ""), mdBlocks(s.markdown))),
    card(null, note("From this dashboard's guide (data/" + SLUG + "/README.md in the repository), which also lists every source and how each is kept current."))];
}
function footer() {
  const f = document.getElementById("foot");
  f.replaceChildren(el("div", {}, META.notes || ""), el("div", { style: "margin-top:6px" }, "Sources: ", ...META.sources.flatMap((s, i) => [i ? " · " : "", link(s.name, s.url), s.cadence ? " (" + s.cadence + ")" : ""])),
    el("div", { style: "margin-top:6px" }, "Read-only. Nothing here is investment advice.",
      META.private ? el("span", {}, " · Private dashboard · ", el("a", { href: "#", onclick: e => { e.preventDefault(); fetch("/api/lock", { method: "POST" }).then(() => location.reload()); } }, "Lock")) : null));
}
async function boot() {
  META = await api("meta");
  document.title = META.title;
  document.getElementById("title").textContent = META.title;
  if (META.category) document.getElementById("crumbcat").textContent = " › " + META.category;
  document.getElementById("blurb").textContent = META.blurb;
  TABS = META.method ? [...META.tabs, ["about", "Method"]] : META.tabs;     // #about: how the numbers are worked out
  if (!TABS.some(t => t[0] === current)) current = TABS[0][0];
  footer();
  await new Promise((ok, bad) => { const s = document.createElement("script"); s.src = "/" + SLUG + ".js"; s.onload = ok; s.onerror = () => bad(new Error("dashboard script failed to load")); document.head.append(s); });
  window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (TABS.some(t => t[0] === h) && h !== current) { current = h; tabs(); render(); } });
  tabs();
  askPanel();
  render();
}
// a private dashboard (app/auth.py): without the passcode cookie its data answers 401, so ask for the passcode once per browser
function unlockCard(info) {
  document.getElementById("title").textContent = "Private dashboard";
  if (info && info.set_up === false) return card("Private dashboard", el("div", { class: "muted" }, "This dashboard is private and its passcode has not been set up yet (PRIVATE_PASSCODE on the server)."));
  const input = el("input", { type: "password", placeholder: "Passcode", autocomplete: "current-password", style: "font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:220px" });
  const msg = el("div", { class: "muted", style: "margin-top:8px" });
  const go = async () => {
    msg.textContent = "Checking…";
    const r = await fetch("/api/unlock", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ passcode: input.value }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok) location.reload(); else { msg.textContent = j.error || "Wrong passcode."; input.select(); }
  };
  input.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  setTimeout(() => input.focus(), 50);
  return card("Private dashboard", el("div", { class: "muted", style: "margin-bottom:8px" }, "Enter the passcode to open it. This browser stays unlocked for 30 days."),
    el("div", { style: "display:flex;gap:8px;flex-wrap:wrap" }, input, el("button", { class: "pill", style: "cursor:pointer;border:0;font:inherit;padding:7px 14px", onclick: go }, "Unlock")), msg);
}
boot().catch(e => document.getElementById("view").replaceChildren(e.status === 401 ? unlockCard(e.info) : card(null, el("div", { class: "err" }, "Could not load: " + e.message))));
</script>
